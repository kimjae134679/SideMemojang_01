name: Build and Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (example: 1.1.2)
        required: true
        default: 1.1.2
  push:
    branches:
      - release/**

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".Replace("release/", "")
          }
          if (-not $version) { throw "Release version is empty." }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore finalized source
        shell: pwsh
        run: |
          $bundleText = "release-bundles/v$env:RELEASE_VERSION-source.tar.xz.b64"
          if (!(Test-Path $bundleText)) { throw "Final source bundle not found: $bundleText" }
          $archive = Join-Path $env:RUNNER_TEMP "sidememojang-source.tar.xz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String((Get-Content $bundleText -Raw).Trim()))
          $temp = Join-Path $env:RUNNER_TEMP "sidememojang-source"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          New-Item -ItemType Directory -Path $temp | Out-Null
          tar -xJf $archive -C $temp
          Get-ChildItem $temp -Force | ForEach-Object {
            Copy-Item $_.FullName -Destination $PWD -Recurse -Force
          }

      - name: Verify package version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $env:RELEASE_VERSION) {
            throw "package.json version $($pkg.version) != release version $env:RELEASE_VERSION"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build NSIS Setup
        shell: pwsh
        run: |
          $env:CI = '1'
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          npm run dist:setup

      - name: Publish finalized source to main
        shell: pwsh
        run: |
          if (Test-Path release-bundles) { Remove-Item release-bundles -Recurse -Force }
          if (Test-Path dev-patches) { Remove-Item dev-patches -Recurse -Force }
          git config user.name "SideMemojang Release Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Release v$env:RELEASE_VERSION"
          }
          $commit = (git rev-parse HEAD).Trim()
          "RELEASE_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          git push origin HEAD:main

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideMemojang-v${{ env.RELEASE_VERSION }}-windows
          if-no-files-found: error
          path: |
            release/side-memojang-setup-*.exe
            release/latest.yml
            release/*.blockmap

      - name: Create GitHub Release and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $files = @()
          $files += Get-ChildItem release/side-memojang-setup-*.exe | ForEach-Object { $_.FullName }
          if (Test-Path release/latest.yml) { $files += (Resolve-Path release/latest.yml).Path }
          $files += Get-ChildItem release/*.blockmap -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "사이드메모장 v$env:RELEASE_VERSION" --generate-notes --target "$env:RELEASE_COMMIT"
          }
