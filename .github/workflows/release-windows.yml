name: Build and Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 1.1.3
  push:
    branches:
      - release/**

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".Replace("release/", "")
          }
          if (-not $version) { throw "Release version is empty." }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply finalized source patch
        shell: pwsh
        run: |
          $pattern = "release-bundles/v$env:RELEASE_VERSION-source.patch.gz.b64.part*"
          $parts = @(Get-ChildItem $pattern -ErrorAction SilentlyContinue | Sort-Object Name)
          if ($parts.Count -eq 0) { throw "Final source patch parts not found: $pattern" }
          $base64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $gzipPath = Join-Path $env:RUNNER_TEMP "sidememojang-source.patch.gz"
          $patchPath = Join-Path $env:RUNNER_TEMP "sidememojang-source.patch"
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($base64))
          $input = [IO.File]::OpenRead($gzipPath)
          $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create($patchPath)
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()
          git apply --binary $patchPath
          if ($LASTEXITCODE -ne 0) { throw "Failed to apply finalized source patch." }

      - name: Verify package version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $env:RELEASE_VERSION) { throw "package.json version mismatch." }
          if ($lock.version -ne $env:RELEASE_VERSION) { throw "package-lock.json version mismatch." }

      - name: Publish clean finalized source to main
        shell: pwsh
        run: |
          git config user.name "SideMemojang Release Bot"
          git config user.email "actions@github.com"
          git rm -r -f --ignore-unmatch node_modules
          $trackedExe = @(git ls-files "*.exe")
          foreach ($exe in $trackedExe) { git rm -f -- "$exe" }
          if (Test-Path release-bundles) { Remove-Item release-bundles -Recurse -Force }
          if (Test-Path dev-patches) { Remove-Item dev-patches -Recurse -Force }
          git add -A
          git commit -m "Release v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release source commit." }
          $commit = (git rev-parse HEAD).Trim()
          "RELEASE_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish finalized source to main." }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build NSIS Setup
        shell: pwsh
        run: |
          $env:CI = '1'
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          npm run dist:setup

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideMemojang-v${{ env.RELEASE_VERSION }}-windows
          if-no-files-found: error
          path: |
            release/side-memojang-setup-*.exe
            release/latest.yml
            release/*.blockmap

      - name: Create GitHub Release and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $files = @()
          $files += Get-ChildItem release/side-memojang-setup-*.exe | ForEach-Object { $_.FullName }
          if (Test-Path release/latest.yml) { $files += (Resolve-Path release/latest.yml).Path }
          $files += Get-ChildItem release/*.blockmap -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "사이드메모장 v$env:RELEASE_VERSION" --generate-notes --target "$env:RELEASE_COMMIT"
          }
